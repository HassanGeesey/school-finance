{% macro class_status_badge(status) %}
{% set colors = {
  "active": "bg-emerald-100 text-emerald-800",
  "completed": "bg-sky-100 text-sky-800",
  "inactive": "bg-slate-100 text-slate-600",
} %}
<span class="rounded-full text-xs font-semibold px-2 py-0.5 {{ colors.get(status, 'bg-slate-100 text-slate-700') }}">{{ class_status_label(status) }}</span>
{% endmacro %}
