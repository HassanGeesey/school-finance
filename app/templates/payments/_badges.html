{% macro payment_method_badge(method) %}
{% set tones = {
  "cash": "badge-emerald",
  "bank": "badge-indigo",
  "other": "badge-slate",
} %}
{% set labels = {
  "cash": "Cash",
  "bank": "Bank",
  "other": "Other",
} %}
<span class="badge {{ tones.get(method, 'badge-neutral') }}">{{ labels.get(method, method) }}</span>
{% endmacro %}
