{% if error %}
<span class="muted">{{ error }}</span>
{% elif not preview %}
<span class="muted">Enter an amount to see what clears.</span>
{% elif preview.credit_cents and not preview.applied_cents %}
<span class="muted">Nothing to clear — <b class="num">{{ money(preview.credit_cents) }}</b> becomes credit.</span>
{% else %}
<b class="num text-base-content">{{ money(preview.applied_cents) }}</b>
{% endif %}
