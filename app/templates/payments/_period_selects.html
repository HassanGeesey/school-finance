{# The record screen's month/year pickers, swapped in when a student is picked
   so the month tag defaults to their oldest unpaid owed month (FW-22-1). #}
<div class="field">
  <label for="payment-month" class="block text-[12.5px] font-semibold mb-1.5">For month</label>
  <select id="payment-month" name="month" class="select w-full">
    {% for value, label in months %}
    <option value="{{ value }}" {% if month|string == value|string %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
<div class="field">
  <label for="payment-year" class="block text-[12.5px] font-semibold mb-1.5">Year</label>
  <select id="payment-year" name="year" class="select w-full">
    {% for value in years %}
    <option value="{{ value }}" {% if year|string == value|string %}selected{% endif %}>{{ value }}</option>
    {% endfor %}
  </select>
</div>
