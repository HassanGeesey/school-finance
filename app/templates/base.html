<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/chart.umd.min.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 antialiased">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="inline-block w-3 h-3 rounded-sm bg-emerald-600" aria-hidden="true"></span>
        <a href="/" class="text-lg font-semibold text-slate-900">{{ app_name }}</a>
      </div>
      <span class="text-sm text-slate-500">v{{ app_version }}</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-400">
    &copy; {{ year }} {{ app_name }}
  </footer>
</body>
</html>
