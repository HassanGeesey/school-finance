{% macro student_status_badge(status) %}
{% set tones = {
  "active": "badge-success",
  "inactive": "badge-neutral",
} %}
{% set labels = {
  "active": "Active",
  "inactive": "Inactive",
} %}
<span class="badge {{ tones.get(status, 'badge-neutral') }}">{{ labels.get(status, status) }}</span>
{% endmacro %}
