{% macro student_status_badge(status) %}
{% set tones = {
  "active": "badge-emerald",
  "inactive": "badge-slate",
} %}
{% set labels = {
  "active": "Active",
  "inactive": "Inactive",
} %}
<span class="badge {{ tones.get(status, 'badge-slate') }}">{{ labels.get(status, status) }}</span>
{% endmacro %}
