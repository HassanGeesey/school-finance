<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Finance â€” dashboard prototype</title>
  <!-- PROTOTYPE: Three dashboard layouts, switchable with ?variant=A|B|C. Synthetic data only. -->
  <style>
    @font-face{font-family:Inter;src:url('../app/static/fonts/inter-latin-400-normal.woff2')}@font-face{font-family:Inter;src:url('../app/static/fonts/inter-latin-600-normal.woff2');font-weight:600}@font-face{font-family:Inter;src:url('../app/static/fonts/inter-latin-700-normal.woff2');font-weight:700}
    :root{--ink:#0d1b2a;--paper:#f6f2ea;--lime:#d8f36a;--line:rgba(13,27,42,.14);--muted:rgba(13,27,42,.62);--shadow:0 20px 45px rgba(13,27,42,.08);--radius:16px}
    *{box-sizing:border-box}html{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}body{margin:0;min-width:320px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:3px}a{text-decoration:none;color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.sidebar{padding:27px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:42px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.04em;font-size:17px}.brand-mark{width:27px;height:27px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:var(--lime);font-size:13px}.nav{display:grid;gap:5px}.nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;font-size:13px;color:var(--muted)}.nav a.active,.nav a:hover{background:var(--ink);color:var(--paper)}.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:17px;font-size:12px;color:var(--muted);line-height:1.6}.main{padding:33px 42px 110px;max-width:1440px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.crumb{font-size:12px;color:var(--muted)}.user{display:flex;align-items:center;gap:12px;font-size:12px}.avatar{background:var(--ink);color:var(--lime);height:32px;width:32px;border-radius:50%;display:grid;place-items:center;font-weight:700}.title-row{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.title-row h1{font-size:clamp(30px,4vw,51px);letter-spacing:-.065em;line-height:.98;margin:0;max-width:700px}.title-row p{color:var(--muted);font-size:13px;margin:12px 0 0}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:600}.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}.btn:hover{transform:translateY(-1px)}.grid{display:grid;gap:18px}.metric-grid{grid-template-columns:repeat(4,1fr)}.metric{border-top:1px solid var(--ink);padding:15px 0 10px}.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;font-size:27px;letter-spacing:-.06em;margin:7px 0 5px}.metric small{font-size:11px;color:var(--muted)}.metric small b{color:var(--ink)}.accent{color:var(--ink);background:var(--lime);padding:2px 5px;border-radius:5px;font-weight:700}.panel{border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.2);padding:22px;box-shadow:var(--shadow)}.panel h2{font-size:14px;letter-spacing:-.03em;margin:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.muted{color:var(--muted)}.chart{height:210px;position:relative;border-bottom:1px solid var(--line);margin:6px 0 12px}.chart:before,.chart:after{content:"";position:absolute;left:0;right:0;border-top:1px dashed var(--line)}.chart:before{top:34%}.chart:after{top:67%}.chart svg{position:absolute;inset:11px 0 0;width:100%;height:calc(100% - 11px);overflow:visible}.legend{display:flex;gap:17px;font-size:11px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:6px}.legend span:last-child:before{background:var(--lime);border:1px solid var(--ink)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:0 0 10px}.table td{padding:14px 0;border-top:1px solid var(--line)}.table td:last-child,.table th:last-child{text-align:right}.person{display:flex;gap:10px;align-items:center}.person-mark{width:27px;height:27px;border-radius:8px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:10px;font-weight:700}.status{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:4px 8px}.status.good{background:var(--lime);border-color:var(--lime)}.status.wait{color:var(--muted)}.switcher{position:fixed;z-index:10;bottom:21px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:13px;background:var(--ink);color:var(--paper);padding:8px 10px;border-radius:99px;box-shadow:0 12px 35px rgba(13,27,42,.25);font-size:11px}.switcher button{width:30px;height:30px;border:0;border-radius:50%;background:rgba(246,242,234,.12);color:var(--paper);font-size:18px;line-height:1}.switcher button:hover{background:var(--lime);color:var(--ink)}.switcher-label{min-width:155px;text-align:center}.switcher-label b{color:var(--lime)}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:var(--paper);padding:12px 15px;border-radius:9px;font-size:12px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}
    /* Variant A â€” command center: sidebar + one dominant cash-flow surface. */
    .a-content{display:grid;grid-template-columns:1.45fr .8fr;gap:18px}.a-hero{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:24px;min-height:290px;position:relative;overflow:hidden}.a-hero:after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(216,243,106,.3);border-radius:50%;right:-85px;bottom:-120px}.a-hero .label{color:rgba(246,242,234,.65);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.a-hero strong{display:block;color:var(--lime);font-size:clamp(45px,6vw,75px);letter-spacing:-.08em;margin-top:25px}.a-hero p{font-size:12px;color:rgba(246,242,234,.7);margin-top:5px}.a-hero .mini-chart{position:absolute;bottom:24px;left:24px;right:24px;height:57px}.a-hero svg{width:100%;height:100%}.a-side{display:grid;gap:18px}.a-content .panel{min-height:135px}.action-list{display:grid;gap:12px}.action-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:12px}.action-row:first-child{border-top:0;padding-top:0}.action-row b{font-size:13px}
    /* Variant B â€” ledger first: top navigation + table as the primary object. */
    .b-shell{max-width:1400px;margin:auto}.b-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--ink);margin-bottom:32px}.b-brand{font-size:19px;font-weight:700;letter-spacing:-.06em}.b-nav{display:flex;gap:22px;font-size:12px;color:var(--muted)}.b-nav a.active{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:4px;text-underline-offset:6px}.b-intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:27px}.b-intro h1{font-size:44px;letter-spacing:-.07em;line-height:1;margin:0}.b-intro p{font-size:12px;color:var(--muted);max-width:300px;line-height:1.6;margin:0}.b-layout{display:grid;grid-template-columns:.83fr 1.5fr;gap:18px}.b-table{min-height:455px}.b-table .panel-head{margin-bottom:8px}.b-summary{display:grid;gap:18px}.b-summary .panel{background:var(--ink);color:var(--paper);border-color:var(--ink)}.b-summary .muted,.b-summary .metric .label{color:rgba(246,242,234,.63)}.b-summary .metric{border-color:rgba(246,242,234,.25)}.b-summary .metric strong{color:var(--lime)}.b-summary .panel h2{color:var(--paper)}.b-summary .btn{color:var(--paper);border-color:rgba(246,242,234,.25)}
    /* Variant C â€” collections pulse: action queue + asymmetric bento. */
    .c-layout{display:grid;grid-template-columns:1fr 1.65fr;gap:18px;align-items:start}.c-queue{background:var(--lime);border-radius:var(--radius);padding:23px;min-height:420px}.c-queue h2{font-size:21px;letter-spacing:-.05em;margin:0 0 7px}.c-queue p{font-size:12px;line-height:1.5;margin:0 0 22px;max-width:30ch}.queue-row{border-top:1px solid rgba(13,27,42,.28);padding:15px 0;display:flex;justify-content:space-between;gap:10px;font-size:12px}.queue-row b{display:block;font-size:13px;margin-bottom:3px}.queue-row small{color:rgba(13,27,42,.62)}.c-right{display:grid;grid-template-columns:1fr 1fr;gap:18px}.c-right .wide{grid-column:span 2}.c-number{font-size:42px;letter-spacing:-.08em;margin:20px 0 0}.bars{display:flex;align-items:end;gap:7px;height:110px;padding-top:16px}.bars i{display:block;flex:1;background:var(--ink);border-radius:5px 5px 0 0;min-height:15px}.bars i:nth-child(2n){background:var(--lime);border:1px solid var(--ink)}.school-switch{display:flex;justify-content:space-between;align-items:center;font-size:12px}.school-switch span{color:var(--muted);font-size:11px}.select{border:1px solid var(--line);border-radius:8px;padding:10px;background:transparent;font-size:12px}.filter-row{display:flex;gap:6px}.filter{background:transparent;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:10px}.filter.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    @media(max-width:900px){.shell{display:block}.sidebar{display:none}.main{padding:24px 20px 105px}.topbar{margin-bottom:30px}.title-row,.b-intro{display:block}.title-row .actions{margin-top:18px}.metric-grid{grid-template-columns:repeat(2,1fr);row-gap:20px}.a-content,.b-layout,.c-layout{grid-template-columns:1fr}.c-right{grid-template-columns:1fr 1fr}.b-head{gap:20px}.b-nav{display:none}.a-hero{min-height:250px}.c-queue{min-height:auto}}
    @media(max-width:560px){.main{padding:20px 15px 105px}.topbar{margin-bottom:25px}.title-row h1,.b-intro h1{font-size:36px}.metric strong{font-size:23px}.panel{padding:17px}.c-right{grid-template-columns:1fr}.c-right .wide{grid-column:auto}.table{font-size:11px}.table th:nth-child(2),.table td:nth-child(2){display:none}.switcher{bottom:13px}.switcher-label{min-width:135px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="switcher" aria-label="Prototype variant switcher"><button id="prev" aria-label="Previous variant">â†</button><div class="switcher-label" id="switcher-label"></div><button id="next" aria-label="Next variant">â†’</button></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const icons={grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.5-3.7 2.3-5.5 5.5-5.5s5 1.8 5.5 5.5M16 5.5a3 3 0 0 1 0 5.6M17 14.5c2.2.3 3.4 2 3.7 4.5"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>'};
    const nav=(active='Overview',top=false)=>`<nav class="${top?'b-nav':'nav'}">${['Overview','Students','Payments','Expenses','Reports'].map((x,i)=>`<a class="${active===x?'active':''}" href="#${x.toLowerCase()}">${top?'':(i===0?icons.grid:i===1?icons.users:icons.arrow)}${x}</a>`).join('')}</nav>`;
    const avatar='<div class="avatar">AM</div>';
    const metrics=`<div class="grid metric-grid"><div class="metric"><span class="label">Collected this month</span><strong>$48,260</strong><small><b>+12.8%</b> vs last month</small></div><div class="metric"><span class="label">Outstanding</span><strong>$12,840</strong><small>34 families to follow up</small></div><div class="metric"><span class="label">Collection rate</span><strong>79.0%</strong><small><b>+4.2 pts</b> since May</small></div><div class="metric"><span class="label">Runway</span><strong>3.8 mo</strong><small>based on current spend</small></div></div>`;
    const chart=`<div class="chart"><svg viewBox="0 0 700 190" preserveAspectRatio="none"><path d="M0 150 C90 145 110 122 175 134 S250 100 310 116 S390 90 460 100 S550 52 700 64" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M0 174 C75 165 125 157 180 160 S270 145 330 150 S405 127 475 138 S580 115 700 121" fill="none" stroke="var(--lime)" stroke-width="4"/><circle cx="700" cy="64" r="5" fill="var(--ink)"/><circle cx="700" cy="121" r="5" fill="var(--lime)" stroke="var(--ink)"/></svg></div><div class="legend"><span>Collected</span><span>Expected</span></div>`;
    const people=`<table class="table"><thead><tr><th>Family</th><th>Class</th><th>Balance</th><th>Status</th></tr></thead><tbody>${[['Abdi Warsame','Grade 6','$840','Follow up'],['Hodan Ali','Grade 3','$420','Partial'],['Yusuf Omar','Grade 8','$300','New']].map((x,i)=>`<tr><td><div class="person"><span class="person-mark">${x[0].split(' ').map(v=>v[0]).join('')}</span>${x[0]}</div></td><td class="muted">${x[1]}</td><td>${x[2]}</td><td><span class="status ${i===1?'wait':''}">${x[3]}</span></td></tr>`).join('')}</tbody></table>`;
    function shell(content,variant='A'){return `<div class="shell"><aside class="sidebar"><a class="brand" href="#"> <span class="brand-mark">SF</span> School Finance</a>${nav()}<div class="sidebar-foot">Al-Noor Academy<br><span>June 2025 Â· USD</span></div></aside><main class="main">${content}</main></div>`}
    function variantA(){return shell(`<div class="topbar"><span class="crumb">School Finance / Overview</span><div class="user">Amina Mohamed ${avatar}</div></div><div class="title-row"><div><h1>Good morning, Amina.</h1><p>Here is the shape of your schoolâ€™s money today.</p></div><div class="actions"><button class="btn" onclick="notify('Report download queued')">Export report</button><button class="btn primary" onclick="notify('Payment flow preview')">Record payment ${icons.arrow}</button></div></div>${metrics}<section class="a-content" style="margin-top:30px"><div class="a-hero"><span class="label">Cash position Â· June 2025</span><strong>$73,420</strong><p>Available balance across cash and bank</p><div class="mini-chart"><svg viewBox="0 0 700 70" preserveAspectRatio="none"><path d="M0 58 C90 57 100 40 170 48 S270 31 330 41 S450 10 530 25 S630 4 700 12" fill="none" stroke="var(--lime)" stroke-width="4"/></svg></div></div><div class="a-side"><div class="panel"><div class="panel-head"><h2>Needs attention</h2><span class="accent">7</span></div><div class="action-list"><div class="action-row"><span>Overdue balances</span><b>$4,320 ${icons.arrow}</b></div><div class="action-row"><span>Uncategorised expenses</span><b>3 ${icons.arrow}</b></div></div></div><div class="panel"><div class="panel-head"><h2>Next close</h2><span class="muted">4 days</span></div><p class="muted" style="font-size:12px;line-height:1.5;margin:0">Review June payments and reconcile the staff advances account.</p></div></div><div class="panel" style="grid-column:1/-1"> <div class="panel-head"><h2>Money in vs expected</h2><div class="filter-row"><button class="filter active">6 months</button><button class="filter">This year</button></div></div>${chart}</div></section>`,'A')}
    function variantB(){return `<div class="b-shell"><header class="b-head"><a class="b-brand" href="#">School Finance</a>${nav('Overview',true)}<div class="user">${avatar}</div></header><div class="b-intro"><div><h1>Overview</h1><p class="muted" style="margin-top:10px">June 01 â€” June 30, 2025 Â· Al-Noor Academy</p></div><div class="actions"><button class="btn">Jun 2025âŒ„</button><button class="btn primary" onclick="notify('CSV export preview')">Export CSV</button></div></div><div class="b-layout"><div class="b-summary"><div class="panel"><div class="panel-head"><h2>Monthly position</h2><span class="accent">On track</span></div><div class="metric"><span class="label">Net movement</span><strong>$8,460</strong><small>after expenses</small></div><div class="metric"><span class="label">Collected</span><strong>$48,260</strong><small>79% of expected</small></div><button class="btn" style="margin-top:18px;width:100%" onclick="notify('Payment flow preview')">Record a payment ${icons.arrow}</button></div><div class="panel"><div class="panel-head"><h2>Collection trend</h2><span class="muted">6 months</span></div>${chart}</div></div><div class="panel b-table"><div class="panel-head"><div><h2>Recent money movement</h2><p class="muted" style="font-size:11px;margin:7px 0 0">Every entry is linked to a student or category.</p></div><button class="btn">View ledger ${icons.arrow}</button></div>${people}<div style="margin-top:25px;text-align:center"><button class="btn" onclick="notify('Ledger opened')">See all activity</button></div></div></div></div>`}
    function variantC(){return shell(`<div class="topbar"><span class="crumb">Al-Noor Academy / Collections pulse</span><div class="user">Amina Mohamed ${avatar}</div></div><div class="title-row"><div><h1>Make the next move.</h1><p>Three small actions keep this month healthy.</p></div><button class="btn primary" onclick="notify('New payment preview')">Record payment ${icons.arrow}</button></div><div class="c-layout"><section class="c-queue"><h2>Collection queue</h2><p>Prioritised by balance, age, and the familyâ€™s recent activity.</p><div class="queue-row"><div><b>Abdi Warsame</b><small>Grade 6 Â· 3 months overdue</small></div><strong>$840</strong></div><div class="queue-row"><div><b>Hodan Ali</b><small>Grade 3 Â· partial payment</small></div><strong>$420</strong></div><div class="queue-row"><div><b>Yusuf Omar</b><small>Grade 8 Â· first reminder</small></div><strong>$300</strong></div><button class="btn" style="margin-top:15px;width:100%;border-color:var(--ink)" onclick="notify('Arrears list opened')">Open all arrears ${icons.arrow}</button></section><section class="c-right"><div class="panel"><div class="school-switch"><h2>Expected</h2><span>June</span></div><div class="c-number">$61.1k</div><div class="bars"><i style="height:40%"></i><i style="height:55%"></i><i style="height:49%"></i><i style="height:78%"></i><i style="height:69%"></i><i style="height:88%"></i><i style="height:81%"></i></div></div><div class="panel"><div class="school-switch"><h2>Collected</h2><span>June</span></div><div class="c-number">$48.3k</div><p class="muted" style="font-size:12px;line-height:1.5;margin-top:25px"><span class="accent">79%</span> collection rate<br>+$5.4k since May</p></div><div class="panel wide"><div class="panel-head"><div><h2>Families with a balance</h2><p class="muted" style="font-size:11px;margin:7px 0 0">Follow up is freshest when it is specific.</p></div><select class="select" aria-label="Balance filter"><option>All balances</option><option>Over $500</option></select></div>${people}</div></section></div>`) }
    const variants={A:{name:'Command center',render:variantA},B:{name:'Ledger first',render:variantB},C:{name:'Collections pulse',render:variantC}};let key=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();if(!variants[key])key='A';
    function render(){document.getElementById('app').innerHTML=variants[key].render();document.getElementById('switcher-label').innerHTML=`<b>${key}</b> â€” ${variants[key].name}`;history.replaceState(null,'',`?variant=${key}`)}
    function move(step){key=['A','B','C'][(['A','B','C'].indexOf(key)+step+3)%3];render()}
    function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});render();
  </script>
</body>
</html>
